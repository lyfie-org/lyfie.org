name: site

# Builds, validates and deploys the organisation website (lyfie.org).
#
# Deployed from Actions rather than through Cloudflare's own Git integration
# (Workers Builds), so the exact toolchain this repo pins — Node from
# .node-version and pnpm from package.json "packageManager" — is the one that
# builds production, and every check below gates the deploy.
#
# The site is a Cloudflare Worker with static assets (worker "lyfie-org",
# custom domain www.lyfie.org), not a Pages project:
#   main          → `wrangler deploy`          → production
#   development   → `wrangler versions upload` → preview URL only, production
#                   untouched: https://development-lyfie-org.<subdomain>.workers.dev
#
# Push-only by design: pull requests, manual runs and other branches trigger
# nothing. Merging development into main is a push to main → production.
#
# Requires two repository secrets, added by hand in Settings → Secrets:
#   CLOUDFLARE_API_TOKEN    — scoped to "Workers Scripts — Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "**.md"
      - ".docs/**"

concurrency:
  group: site-${{ github.ref }}
  # Never cancel a production deploy halfway; superseded previews can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the site
        run: pnpm build

      # Fonts are self-hosted and the CSP pins font-src to 'self', so a stray
      # third-party font link would silently break type in production.
      - name: Verify no third-party font origin shipped
        run: pnpm check:fonts

      # Validates wrangler.jsonc and the dist/ asset bundle exactly as the real
      # deploy will read them, without needing credentials.
      - name: Wrangler deploy dry-run
        run: pnpm cf:check

      # Serves dist/ through `wrangler dev` (real workerd) and checks every page,
      # hashed assets, fonts, the _headers security policy, and that unknown
      # paths get the styled 404 with a real 404 status.
      - name: Smoke test in the Workers runtime
        run: pnpm smoke

      # Sideways scroll is invisible until somebody opens the site on a phone.
      # Every built page is loaded at 320px and 1440px in a real browser.
      - name: Install Chromium for the layout check
        run: pnpm exec playwright install --with-deps chromium

      - name: Check no page scrolls horizontally
        run: pnpm check:layout

      # Wrangler is run straight from the repo's own devDependencies rather than
      # through cloudflare/wrangler-action, which installs its own copy; calling
      # it directly pins the deploy to the wrangler version the lockfile resolves.
      #
      # Secrets come in as environment variables, which wrangler reads natively.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ "$BRANCH" = "main" ]; then
            # Production: new version, promoted to 100% → www.lyfie.org
            pnpm exec wrangler deploy --message "$MESSAGE" | tee deploy.log
            echo "### Deployed to production: https://www.lyfie.org" >> "$GITHUB_STEP_SUMMARY"
          else
            # development → preview: upload a version without deploying it.
            pnpm exec wrangler versions upload \
              --preview-alias development \
              --message "$MESSAGE" | tee deploy.log
            url=$(grep -oE 'https://[a-z0-9-]+-lyfie-org\.[a-z0-9-]+\.workers\.dev' deploy.log | tail -1)
            echo "### Preview (${BRANCH}): ${url:-see deploy log}" >> "$GITHUB_STEP_SUMMARY"
          fi
